name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:////tmp/hrms-ci.sqlite3
      SECRET_KEY: ci-only-not-a-deployment-secret
      BOOTSTRAP_DEMO_DATA: 'false'
      ENABLE_INTERNAL_SCHEDULER: 'false'
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: "Known issues: backend Ruff"
        continue-on-error: true
        run: ruff check .
      - name: "Known issues: backend Black"
        continue-on-error: true
        run: black --check .
      - name: Apply migrations to a fresh test database
        run: python -m alembic upgrade head
      - name: Backend tests (blocking)
        run: python -m pytest --ignore=tests/test_cors.py --cov=app --cov-report=term-missing --cov-report=xml
      - name: "Known issues: backend CORS tests"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m pytest tests/test_cors.py -q
      - run: pip-audit -r requirements.txt
      - run: bandit -r app
      - name: Save backend source
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/hrms-artifacts
          git archive --format=tar.gz --output=/tmp/hrms-artifacts/backend-source.tar.gz HEAD
      - name: Upload backend source
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-source-${{ github.sha }}
          path: /tmp/hrms-artifacts/backend-source.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
